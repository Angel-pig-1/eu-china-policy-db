<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政策库 · CEA 中欧档案</title>
<meta name="description" content="中欧档案：98 条中欧经贸与产业政策原文镜像，支持组合筛选、深链、CSV 导出与原始文件阅读。">
<script>
(function(){try{var t=localStorage.getItem('ices-theme');if(t==='dark'||(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}}catch(e){}})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17.5' fill='%23f2f2ef' stroke='%23082d4f' stroke-width='2'/%3E%3Cellipse cx='20' cy='20' rx='17.5' ry='7.5' fill='none' stroke='%23082d4f' stroke-width='1.2'/%3E%3Ccircle cx='27.5' cy='13' r='4' fill='%23c24e32'/%3E%3Ccircle cx='11.5' cy='26.5' r='4' fill='%23c24e32'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
</head>
<body class="page-app">
<a class="skip-link" href="#main">跳至主要内容</a>
<div id="site-header"></div>

<main id="main" class="app">
  <div class="app-head">
    <div class="app-head-row">
      <h1 class="app-title">政策库</h1>
      <p class="app-desc">中欧经贸交锋政策档案 · 组合筛选 / 深链 / CSV 导出</p>
    </div>
  </div>

  <div class="filter-bar" role="group" aria-label="筛选条件">
    <div class="search-control">
      <span aria-hidden="true" id="search-icon"></span>
      <input type="search" id="f-q" name="q" placeholder="搜索标题、背景、影响、监管框架、行业代码…" aria-label="搜索政策" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div class="segmented" id="f-side" role="group" aria-label="按侧别筛选">
      <button type="button" data-val="all" aria-pressed="true">全部</button>
      <button type="button" data-val="EU" aria-pressed="false">EU</button>
      <button type="button" data-val="CN" aria-pressed="false">CN</button>
    </div>
    <div class="select-control">
      <select id="f-year" aria-label="按年份筛选"></select>
    </div>
    <div class="select-control">
      <select id="f-source" aria-label="按来源筛选"></select>
    </div>
    <div class="select-control">
      <select id="f-sort" aria-label="排序方式"></select>
    </div>
  </div>

  <div class="filter-actions">
    <p class="result-count" id="result-count" role="status"></p>
    <div class="chip-row" id="chip-row"></div>
    <div class="action-spacer"></div>
    <button type="button" class="btn btn-ghost" id="btn-reset"></button>
    <button type="button" class="btn" id="btn-csv"></button>
  </div>

  <div class="app-body">
    <section class="results-pane" aria-label="政策结果列表">
      <div class="results-list" id="result-list" role="listbox" aria-label="政策结果" tabindex="0"></div>
    </section>
    <div class="detail-backdrop" id="detail-backdrop" hidden></div>
    <section class="detail-pane" id="detail-pane" aria-label="政策详情">
      <div class="detail-inner" id="detail-inner"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/policies.js"></script>
</body>
</html>
