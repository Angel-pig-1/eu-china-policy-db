<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中欧经贸政策数据库 · ICES 镜像站</title>
<style>
:root{--paper:#f6f2ea;--paper2:#efe9dd;--ink:#211d18;--ink2:#575046;--line:#d8d0c0;--acc:#DA7756;--acc-d:#b85a3c;--eu:#3d5a99;--cn:#a63d40;--serif:"Songti SC","STSong","Noto Serif SC",serif;--sans:-apple-system,"PingFang SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.topnav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:linear-gradient(rgba(246,242,234,.96),rgba(246,242,234,.82));backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:19px;font-weight:900;letter-spacing:1px}
.brand span{color:var(--acc);font-size:12px;margin-left:6px;font-weight:600}
.topnav .links{display:flex;gap:26px}
.topnav .links a{font-size:13.5px;color:var(--ink2);letter-spacing:2px;position:relative;padding-bottom:3px;transition:color .2s}
.topnav .links a:hover{color:var(--ink)}
.topnav .links a.on{color:var(--acc-d);font-weight:600}
.topnav .links a.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--acc)}
footer.site{padding:34px 32px;border-top:1px solid var(--line);margin-top:60px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);letter-spacing:.5px}

body{min-height:100vh;display:flex;flex-direction:column}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:120px 48px 60px;max-width:1200px;margin:0 auto;width:100%}
.eyebrow{font-size:12px;letter-spacing:6px;color:var(--acc-d);text-transform:uppercase;font-weight:600}
h1{font-family:var(--serif);font-size:clamp(52px,8.5vw,110px);font-weight:900;line-height:1.1;margin:22px 0 0;letter-spacing:2px}
h1 em{font-style:normal;color:var(--acc-d)}
.cta{margin-top:56px;display:inline-flex;gap:14px;align-items:center}
.btn-enter{font-size:15px;letter-spacing:4px;padding:16px 42px;background:var(--ink);color:var(--paper);border-radius:2px;transition:all .25s;font-weight:600}
.btn-enter:hover{background:var(--acc-d);transform:translateY(-2px);box-shadow:0 10px 24px rgba(184,90,60,.25)}
.btn-ghost{font-size:13.5px;letter-spacing:3px;padding:15px 26px;border:1px solid var(--line);border-radius:2px;color:var(--ink2);transition:all .25s}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc-d)}
.timeline-wrap{margin-top:auto;padding-top:80px}
.timeline{display:flex;align-items:flex-end;gap:10px;height:130px}
.tl-item{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.tl-bar{background:linear-gradient(180deg,var(--acc) 0%,#c9a88f 100%);border-radius:2px 2px 0 0;min-height:14px;transition:filter .2s}
.tl-item:hover .tl-bar{filter:brightness(1.12)}
.tl-y{text-align:center;font-size:11.5px;color:var(--ink2);padding-top:8px;font-family:ui-monospace,monospace}
@media(max-width:760px){.hero{padding:100px 24px 40px}.topnav{padding:14px 20px}.topnav .links{gap:16px}}
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">ICES<span>·镜像</span></a>
  <div class="links">
    <a href="index.html" data-pg="home">封面</a>
    <a href="policies.html" data-pg="policies">政策库</a>
    <a href="stats.html" data-pg="stats">数据总览</a>
  </div>
</nav>
<section class="hero">
  <div class="eyebrow">ICES · Mirror</div>
  <h1>中欧经贸<br><em>政策数据库</em></h1>
  <div class="cta">
    <a class="btn-enter" href="policies.html">进入数据库 →</a>
    <a class="btn-ghost" href="stats.html">数据总览</a>
  </div>
  <div class="timeline-wrap">
    <div class="timeline"><div class="tl-item"><div class="tl-bar" style="height:17%"></div><div class="tl-y">2004</div></div><div class="tl-item"><div class="tl-bar" style="height:17%"></div><div class="tl-y">2005</div></div><div class="tl-item"><div class="tl-bar" style="height:17%"></div><div class="tl-y">2006</div></div><div class="tl-item"><div class="tl-bar" style="height:17%"></div><div class="tl-y">2010</div></div><div class="tl-item"><div class="tl-bar" style="height:26%"></div><div class="tl-y">2012</div></div><div class="tl-item"><div class="tl-bar" style="height:20%"></div><div class="tl-y">2016</div></div><div class="tl-item"><div class="tl-bar" style="height:20%"></div><div class="tl-y">2017</div></div><div class="tl-item"><div class="tl-bar" style="height:20%"></div><div class="tl-y">2019</div></div><div class="tl-item"><div class="tl-bar" style="height:20%"></div><div class="tl-y">2020</div></div><div class="tl-item"><div class="tl-bar" style="height:20%"></div><div class="tl-y">2021</div></div><div class="tl-item"><div class="tl-bar" style="height:20%"></div><div class="tl-y">2022</div></div><div class="tl-item"><div class="tl-bar" style="height:36%"></div><div class="tl-y">2023</div></div><div class="tl-item"><div class="tl-bar" style="height:75%"></div><div class="tl-y">2024</div></div><div class="tl-item"><div class="tl-bar" style="height:57%"></div><div class="tl-y">2025</div></div><div class="tl-item"><div class="tl-bar" style="height:100%"></div><div class="tl-y">2026</div></div></div>
  </div>
</section>
<script>document.querySelector('.topnav a[data-pg=home]').classList.add('on')</script>
</body>
</html>
