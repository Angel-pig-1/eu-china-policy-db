<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文献库 · ICES 镜像站</title>
<style>
:root{--paper:#f6f2ea;--paper2:#efe9dd;--ink:#211d18;--ink2:#575046;--line:#d8d0c0;--acc:#DA7756;--acc-d:#b85a3c;--eu:#3d5a99;--cn:#a63d40;--serif:"Songti SC","STSong","Noto Serif SC",serif;--sans:-apple-system,"PingFang SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.topnav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:linear-gradient(rgba(246,242,234,.96),rgba(246,242,234,.82));backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:19px;font-weight:900;letter-spacing:1px}
.brand span{color:var(--acc);font-size:12px;margin-left:6px;font-weight:600}
.topnav .links{display:flex;gap:26px}
.topnav .links a{font-size:13.5px;color:var(--ink2);letter-spacing:2px;position:relative;padding-bottom:3px;transition:color .2s}
.topnav .links a:hover{color:var(--ink)}
.topnav .links a.on{color:var(--acc-d);font-weight:600}
.topnav .links a.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--acc)}
footer.site{padding:34px 32px;border-top:1px solid var(--line);margin-top:60px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);letter-spacing:.5px}

body{height:100vh;overflow:hidden;display:flex;flex-direction:column;padding-top:57px}
.toolbar{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{flex:1;min-width:170px;max-width:420px}
.search input{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:2px;font-size:13.5px;outline:none;background:#fff;font-family:var(--sans);transition:border-color .2s}
.search input:focus{border-color:var(--acc)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 15px;border:1px solid var(--line);border-radius:2px;font-size:12.5px;cursor:pointer;background:var(--paper);color:var(--ink2);letter-spacing:1px;transition:all .2s;white-space:nowrap}
.pill:hover{border-color:var(--acc)}
.pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font-size:12px;color:var(--ink2);letter-spacing:1px;font-family:ui-monospace,monospace}
main{flex:1;display:flex;overflow:hidden}
#list{width:440px;border-right:1px solid var(--line);overflow-y:auto;background:var(--paper)}
.entry{padding:13px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.entry:hover{background:var(--paper2)}
.entry.active{background:#f9ece5;border-left:3px solid var(--acc);padding-left:17px}
.entry .head{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.flag{font-size:10.5px;padding:2px 7px;border-radius:2px;font-weight:700;letter-spacing:1px;flex-shrink:0}
.flag.c01{background:#e3e9f7;color:var(--eu)}
.flag.c02{background:#f6e3d8;color:var(--acc-d)}
.flag.c03{background:#e8e6e1;color:var(--ink2)}
.stag{font-size:10px;padding:2px 6px;border-radius:2px;background:var(--paper2);color:var(--ink2);font-weight:600}
.stag.EU{background:#e3e9f7;color:var(--eu)}.stag.CN{background:#f6e3e3;color:var(--cn)}.stag.INTL{background:#eceade;color:#7a7261}
.ttag{font-size:10px;padding:2px 6px;border-radius:2px;background:#f3e8d8;color:var(--acc-d);font-weight:700}
.entry .date{font-size:11px;color:var(--ink2);font-family:ui-monospace,monospace}
.entry .name{font-size:13.5px;line-height:1.5;margin-top:4px;font-weight:500}
#detail{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fff}
#meta{padding:22px 30px;overflow-y:auto;border-bottom:1px solid var(--line);max-height:48%}
#meta h2{font-family:var(--serif);font-size:20px;margin-bottom:12px;line-height:1.4;font-weight:800}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;font-size:13px;line-height:1.7}
.meta-grid b{color:var(--ink2);font-weight:600;display:block;font-size:11px;letter-spacing:2px;margin-bottom:2px}
.tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:3px 10px;background:var(--paper2);border-radius:2px;color:var(--ink2);cursor:pointer;border:1px solid transparent;transition:all .2s}
.tag:hover{background:var(--acc);color:#fff}
.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 18px;border-radius:2px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);letter-spacing:1px;transition:all .2s}
.btn.primary{background:var(--acc-d);color:#fff;border-color:var(--acc-d)}
.btn.primary:hover{background:var(--acc)}
.srcpath{font-size:11px;color:#a39a89;font-family:ui-monospace,monospace}
#viewer{flex:1;position:relative;background:#e9e6df}
#viewer iframe{width:100%;height:100%;border:0}
#viewer .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--ink2);font-size:14px;font-family:var(--serif)}
#viewer .placeholder small{font-size:11.5px;letter-spacing:2px;color:#a39a89}
.noresult{padding:48px;text-align:center;color:var(--ink2);font-size:13px}
@media(max-width:860px){#list{width:100%}main{flex-direction:column}body{overflow:auto}#meta{max-height:none}}
</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="index.html">ICES<span>·镜像</span></a>
  <div class="links">
    <a href="index.html" data-pg="home">封面</a>
    <a href="policies.html" data-pg="policies">政策库</a>
    <a href="library.html" data-pg="library">文献库</a>
    <a href="stats.html" data-pg="stats">数据总览</a>
  </div>
</nav>
<div class="toolbar">
  <div class="search"><input id="q" placeholder="搜索标题 / 机构 / 标签 / 类目…（按 / 聚焦）"></div>
  <div class="pills">
    <span class="pill active" data-coll="all">全部</span>
    <span class="pill" data-coll="01">中欧关系</span>
    <span class="pill" data-coll="02">贸易协定</span>
    <span class="pill" data-coll="03">航天法</span>
  </div>
  <div class="pills">
    <span class="pill active" data-side="all">全部侧别</span>
    <span class="pill" data-side="EU">EU</span>
    <span class="pill" data-side="CN">CN</span>
    <span class="pill" data-side="INTL">INTL</span>
  </div>
  <span class="count" id="count"></span>
</div>
<main>
  <div id="list"></div>
  <div id="detail">
    <div id="meta"><div class="placeholder">← 选择左侧文献查看详情与原文</div></div>
    <div id="viewer"><div class="placeholder">原文将在此内嵌显示</div></div>
  </div>
</main>
<script src="library_data.js"></script>
<script>
const listEl=document.getElementById('list'),metaEl=document.getElementById('meta'),viewerEl=document.getElementById('viewer'),countEl=document.getElementById('count');
let state={q:'',coll:'all',side:'all'};
const norm=s=>(s||'').toLowerCase();
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const rows=LIB.filter(r=>{
    if(state.coll!=='all'&&r.coll!==state.coll)return false;
    if(state.side!=='all'&&r.side!==state.side)return false;
    if(state.q){const q=norm(state.q);
      if(!(norm(r.title).includes(q)||norm(r.inst).includes(q)||norm(r.cat).includes(q)||norm(r.type).includes(q)||r.tags.some(t=>norm(t).includes(q))))return false;}
    return true;
  });
  countEl.textContent=rows.length+' / '+LIB.length;
  if(!rows.length){listEl.innerHTML='<div class="noresult">无匹配结果</div>';return;}
  listEl.innerHTML=rows.map(r=>`<div class="entry" data-id="${r.id}">
    <div class="head"><span class="flag c${r.coll}">${r.collName}</span><span class="stag ${r.side}">${r.side}</span><span class="ttag">${esc(r.type)}</span><span class="date">${r.date||'—'}</span></div>
    <div class="name">${esc(r.title)}</div></div>`).join('');
  listEl.querySelectorAll('.entry').forEach(e=>e.onclick=()=>show(e.dataset.id));
}
function show(id){
  const r=LIB.find(x=>x.id===id);if(!r)return;
  listEl.querySelectorAll('.entry').forEach(e=>e.classList.toggle('active',e.dataset.id===id));
  metaEl.innerHTML=`<h2>${esc(r.title)}</h2>
    <div class="meta-grid">
      <div><b>收藏夹</b>${r.collName} · ${r.coll}</div>
      <div><b>类目</b>${esc(r.cat||'—')}</div>
      <div><b>日期</b>${r.date||'—'}</div>
      <div><b>侧别 / 类型</b>${r.side} · ${esc(r.type)}</div>
      <div><b>机构来源</b>${esc(r.inst||'—')}</div>
      <div><b>大小</b>${r.sizeKB} KB${r.fmt==='html'?' · Markdown 转 HTML':''}</div>
    </div>
    ${r.tags.length?`<div class="tags">${r.tags.map(t=>`<span class="tag" onclick="tagSearch('${esc(t).replace(/'/g,"\\'")}')">${esc(t)}</span>`).join('')}</div>`:''}
    <div class="actions">
      <a class="btn primary" onclick="view('${esc(r.file)}')">查看原文</a>
      <a class="btn" href="${encodeURI(r.file)}" target="_blank">新窗口打开</a>
      <span class="srcpath">源: ${esc(r.src)}</span>
    </div>`;
  metaEl.scrollTop=0;
  view(r.file);
}
function view(f){viewerEl.innerHTML=`<iframe src="${encodeURI(f)}"></iframe>`;}
function tagSearch(t){state.q=t;document.getElementById('q').value=t;render();viewerEl.innerHTML='<div class="placeholder">← 点击条目查看原文</div>';}
document.getElementById('q').oninput=e=>{state.q=e.target.value;render();};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('q').focus();}});
document.querySelectorAll('.pill[data-coll]').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill[data-coll]').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');state.coll=p.dataset.coll;render();
});
document.querySelectorAll('.pill[data-side]').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.pill[data-side]').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');state.side=p.dataset.side;render();
});
render();
</script>
</body>
</html>
