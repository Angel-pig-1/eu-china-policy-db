<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a2b2f">
<title>数据总览 · CEA 中欧档案</title>
<meta name="description" content="中欧档案数据总览：年度对比、侧别占比、监管框架与行业代码排行，每张图表都可以继续检索。">
<script>
(function(){try{var t=localStorage.getItem('ices-theme');if(t==='dark'||(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}}catch(e){}})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17.5' fill='%23f2f2ef' stroke='%23082d4f' stroke-width='2'/%3E%3Cellipse cx='20' cy='20' rx='17.5' ry='7.5' fill='none' stroke='%23082d4f' stroke-width='1.2'/%3E%3Ccircle cx='27.5' cy='13' r='4' fill='%23c24e32'/%3E%3Ccircle cx='11.5' cy='26.5' r='4' fill='%23c24e32'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip-link" href="#main">跳至主要内容</a>
<div id="site-header"></div>

<main id="main">
  <section class="section" style="padding-top:clamp(36px,6vh,72px)">
    <div class="section-head">
      <h1 style="font-size:clamp(26px,3vw,36px)">数据总览</h1>
      <span class="en">OVERVIEW</span>
    </div>
    <p class="stats-asof" id="stats-asof"></p>
    <div class="stats-grid" id="stats-grid"></div>
  </section>

  <section class="section" aria-label="年度对比">
    <div class="section-head">
      <h2>年度双向对比</h2>
      <span class="en">EU vs CN PER YEAR</span>
    </div>
    <div class="legend" style="margin-bottom:14px">
      <span class="legend-item"><span class="legend-swatch eu"></span>EU →</span>
      <span class="legend-item"><span class="legend-swatch cn"></span>← CN</span>
    </div>
    <div id="diverging-chart"></div>
  </section>

  <section class="section" aria-label="占比与排行">
    <div class="charts-2col">
      <div>
        <div class="panel">
          <h2 class="panel-title">监管框架 · 前八位</h2>
          <p class="panel-sub">点击条目进入对应检索</p>
          <div class="rank-list" id="framings-rank"></div>
        </div>
        <div class="panel">
          <h2 class="panel-title">行业代码 · 前十二位</h2>
          <p class="panel-sub">点击条目进入对应检索</p>
          <div class="rank-list" id="industries-rank"></div>
        </div>
      </div>
      <div>
        <div class="panel">
          <h2 class="panel-title">侧别占比</h2>
          <p class="panel-sub">点击图例进入对应筛选</p>
          <div class="donut-wrap" id="donut"></div>
        </div>
        <div class="panel">
          <h2 class="panel-title">最新六项政策</h2>
          <p class="panel-sub">点击标题打开记录</p>
          <div class="compact-list" id="latest6"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="data.js"></script>
<script src="library_data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/stats.js?v=20261104"></script>
</body>
</html>
